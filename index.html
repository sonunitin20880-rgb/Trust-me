<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trust Me...</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      background-color: #111; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color 0.1s ease;
    }
    #trust-btn {
      padding: 22px 45px; font-size: 26px; font-weight: bold; cursor: pointer;
      background: linear-gradient(45deg, #a855f7, #ec4899); color: white; 
      border: none; border-radius: 50px;
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4); z-index: 10;
      transition: transform 0.1s ease;
    }
    #trust-btn:active { transform: scale(0.95); }
    #party-zone { display: none; text-align: center; z-index: 5; }
    .character-box { width: 280px; height: 280px; margin: 0 auto; display: flex; align-items: center; justify-content: center; }
    .character-box img { width: 100%; height: auto; }
    h1 { color: white; font-size: 36px; margin-top: 30px; letter-spacing: 2px; text-shadow: 0 0 15px rgba(255, 255, 255, 0.8); font-weight: 900; }
    @keyframes flash-bg {
      0% { background-color: #3b82f6; }
      25% { background-color: #ec4899; }
      50% { background-color: #10b981; }
      75% { background-color: #f59e0b; }
      100% { background-color: #8b5cf6; }
    }
    .active-party { animation: flash-bg 0.5s infinite alternate ease-in-out; }
  </style>
</head>
<body>

  <button id="trust-btn" onclick="letThePartyStart()">Trust me...</button>

  <div id="party-zone">
    <div class="character-box">
      <!-- High energy dancing dragon loop -->
      <img src="https://tenor.com" alt="Dancing Dragon">
    </div>
    <h1>VIBE CHECK: UNLOCKED ⚡</h1>
    
    <!-- Mood-boosting upbeat loop track -->
    <audio id="dance-track" loop preload="auto">
      <source src="https://soundhelix.com" type="audio/mpeg">
    </audio>
  </div>

  <script>
    function letThePartyStart() {
      document.getElementById('trust-btn').style.display = 'none';
      document.body.classList.add('active-party');
      document.getElementById('party-zone').style.display = 'block';
      
      const music = document.getElementById('dance-track');
      music.play().catch(e => console.log("Audio bypass handled:", e));
    }
  </script>
</body>
</html>
